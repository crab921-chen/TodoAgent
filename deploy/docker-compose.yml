services:
  todo-agent:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file:
      - ../.env
    environment:
      APP_ENV: production
      TODO_DATABASE_PATH: /app/database/todo.db
      TODO_CHECKPOINT_DATABASE_PATH: /app/database/checkpoints.db
      LOG_LEVEL: INFO
    ports:
      - "8501:8501"
    volumes:
      - ../database:/app/database
      - ../backups:/app/backups
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-m", "ops.healthcheck", "--json"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  todo-agent-worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file:
      - ../.env
    environment:
      APP_ENV: production
      TODO_DATABASE_PATH: /app/database/todo.db
      TODO_CHECKPOINT_DATABASE_PATH: /app/database/checkpoints.db
      LOG_LEVEL: INFO
    volumes:
      - ../database:/app/database
    command: ["python", "-m", "ops.reminder_worker"]
    restart: unless-stopped
